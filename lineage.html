<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lineage migration</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f4f0;
      color: #2c2c2a;
      padding: 24px;
      min-height: 100vh;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1c; color: #d3d1c7; }
    }

    h1 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 16px;
      color: #2c2c2a;
    }
    @media (prefers-color-scheme: dark) { h1 { color: #d3d1c7; } }

    /* ── Legend ── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #5f5e5a;
    }
    @media (prefers-color-scheme: dark) { .legend { color: #888780; } }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

    /* ── Level sections ── */
    .level-section { margin-bottom: 8px; }
    .level-label {
      font-size: 11px;
      font-weight: 500;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 6px;
      padding-left: 2px;
    }
    .nodes-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 2px; }

    /* ── Node chips ── */
    .node {
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity .15s, transform .12s, filter .12s;
      user-select: none;
      white-space: nowrap;
    }
    .node:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .node.active { outline: 2px solid #2c2c2a; outline-offset: 2px; }
    .node.dimmed { opacity: .15; }
    @media (prefers-color-scheme: dark) { .node.active { outline-color: #d3d1c7; } }

    .node-code { font-weight: 700; margin-right: 4px; }
    .node-name { font-weight: 400; opacity: .85; }

    /* ── Level color classes ── */
    .lv0 { background:#D3D1C7; color:#2C2C2A; border-color:#B4B2A9; }
    .lv1 { background:#B5D4F4; color:#042C53; border-color:#85B7EB; }
    .lv2 { background:#9FE1CB; color:#04342C; border-color:#5DCAA5; }
    .lv3 { background:#FAC775; color:#412402; border-color:#EF9F27; }
    .lv4 { background:#F5C4B3; color:#4A1B0C; border-color:#F0997B; }
    .lv5 { background:#CECBF6; color:#26215C; border-color:#AFA9EC; }
    .lv6 { background:#C0DD97; color:#173404; border-color:#97C459; }

    @media (prefers-color-scheme: dark) {
      .lv0 { background:#444441; color:#D3D1C7; border-color:#5F5E5A; }
      .lv1 { background:#0C447C; color:#B5D4F4; border-color:#185FA5; }
      .lv2 { background:#085041; color:#9FE1CB; border-color:#0F6E56; }
      .lv3 { background:#633806; color:#FAC775; border-color:#854F0B; }
      .lv4 { background:#712B13; color:#F5C4B3; border-color:#993C1D; }
      .lv5 { background:#3C3489; color:#CECBF6; border-color:#534AB7; }
      .lv6 { background:#27500A; color:#C0DD97; border-color:#3B6D11; }
    }

    /* ── Divider ── */
    .divider { height: 1px; background: rgba(0,0,0,.08); margin: 8px 0 2px; }
    @media (prefers-color-scheme: dark) { .divider { background: rgba(255,255,255,.08); } }

    /* ── Detail panel ── */
    .deps-panel {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid rgba(0,0,0,.1);
      font-size: 12px;
      color: #5f5e5a;
      min-height: 60px;
    }
    @media (prefers-color-scheme: dark) {
      .deps-panel { background: #2a2a28; border-color: rgba(255,255,255,.1); color: #888780; }
    }
    .deps-panel h4 {
      font-size: 13px;
      font-weight: 500;
      color: #2c2c2a;
      margin-bottom: 10px;
    }
    @media (prefers-color-scheme: dark) { .deps-panel h4 { color: #d3d1c7; } }

    .dep-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: flex-start; }
    .dep-label {
      font-size: 11px;
      color: #888780;
      width: 72px;
      flex-shrink: 0;
      padding-top: 2px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .dep-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .dep-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: filter .12s;
    }
    .dep-tag:hover { filter: brightness(1.1); }
    .hint { color: #888780; font-size: 12px; }

    /* ── Error banner ── */
    .error {
      background: #fcebeb;
      border: 1px solid #f09595;
      color: #a32d2d;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    @media (prefers-color-scheme: dark) {
      .error { background: #501313; border-color: #791f1f; color: #f7c1c1; }
    }
  </style>
</head>
<body>

  <h1>Lineage migration</h1>
  <div id="error-banner" class="error" style="display:none"></div>
  <div class="legend" id="legend"></div>
  <div id="levels-container"></div>
  <div class="deps-panel" id="deps-panel">
    <p class="hint">Cliquez sur un fichier pour voir ses dépendances et les fichiers qui en dépendent.</p>
  </div>

  <script>
    /* ── Config : chemin vers votre fichier JSON ── */
    const DATA_FILE = 'lineage_data.json';

    /* ────────────────────────────────────────────── */

    let allNodes = {};   // id -> node object
    let allCls   = {};   // id -> css class
    let dependents = {}; // id -> [ids that depend on it]
    let activeId = null;
    let levels = [];

    async function loadData() {
      try {
        const res = await fetch(DATA_FILE);
        if (!res.ok) throw new Error(`HTTP ${res.status} – impossible de charger ${DATA_FILE}`);
        const json = await res.json();
        return json;
      } catch (err) {
        document.getElementById('error-banner').style.display = 'block';
        document.getElementById('error-banner').textContent =
          `Erreur de chargement : ${err.message}. ` +
          `Assurez-vous que "${DATA_FILE}" se trouve dans le même dossier que ce fichier HTML ` +
          `et que vous ouvrez la page via un serveur local (ex : Live Server dans VS Code, ` +
          `ou lancez : python -m http.server 8080).`;
        return null;
      }
    }

    function buildLookups(data) {
      levels = data.levels;
      levels.forEach(lv => {
        lv.nodes.forEach(n => {
          allNodes[n.id] = n;
          allCls[n.id]   = lv.cls;
        });
      });
      levels.forEach(lv => {
        lv.nodes.forEach(n => {
          (n.deps || []).forEach(dep => {
            if (!dependents[dep]) dependents[dep] = [];
            dependents[dep].push(n.id);
          });
        });
      });
    }

    function buildLegend() {
      const legend = document.getElementById('legend');
      levels.forEach(lv => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<div class="legend-dot ${lv.cls}"></div><span>${lv.label}</span>`;
        legend.appendChild(item);
      });
    }

    function render() {
      const container = document.getElementById('levels-container');
      container.innerHTML = '';

      levels.forEach(lv => {
        const sec = document.createElement('div');
        sec.className = 'level-section';

        const lbl = document.createElement('div');
        lbl.className = 'level-label';
        lbl.textContent = lv.label;
        sec.appendChild(lbl);

        const row = document.createElement('div');
        row.className = 'nodes-row';

        lv.nodes.forEach(n => {
          const nd = document.createElement('div');
          nd.className = 'node ' + lv.cls;
          nd.dataset.id = n.id;

          if (activeId) {
            const myDeps      = (allNodes[activeId] && allNodes[activeId].deps) || [];
            const myDependents = dependents[activeId] || [];
            const relevant    = [activeId, ...myDeps, ...myDependents];
            if (!relevant.includes(n.id)) nd.classList.add('dimmed');
            if (n.id === activeId)        nd.classList.add('active');
          }

          nd.innerHTML =
            `<span class="node-code">${n.id}</span>` +
            `<span class="node-name">${n.name}</span>`;

          nd.addEventListener('click', () => {
            activeId = (activeId === n.id) ? null : n.id;
            render();
            updatePanel();
          });

          row.appendChild(nd);
        });

        sec.appendChild(row);
        const div = document.createElement('div');
        div.className = 'divider';
        sec.appendChild(div);
        container.appendChild(sec);
      });
    }

    function updatePanel() {
      const panel = document.getElementById('deps-panel');
      if (!activeId) {
        panel.innerHTML = '<p class="hint">Cliquez sur un fichier pour voir ses dépendances et les fichiers qui en dépendent.</p>';
        return;
      }

      const n          = allNodes[activeId];
      const myDeps     = (n && n.deps) || [];
      const myDeps2    = dependents[activeId] || [];

      let html = `<h4>${activeId} – ${n ? n.name : ''}</h4>`;

      // Dépend de
      html += '<div class="dep-row">';
      html += '<div class="dep-label">Dépend de</div><div class="dep-tags">';
      if (myDeps.length === 0) {
        html += '<span style="color:#888780;font-size:11px">Aucune dépendance</span>';
      } else {
        myDeps.forEach(dep => {
          const cls = allCls[dep] || 'lv0';
          const nm  = allNodes[dep] ? allNodes[dep].name : '?';
          html += `<span class="dep-tag ${cls}" onclick="selectNode('${dep}')">${dep} ${nm}</span>`;
        });
      }
      html += '</div></div>';

      // Requis par
      html += '<div class="dep-row">';
      html += '<div class="dep-label">Requis par</div><div class="dep-tags">';
      if (myDeps2.length === 0) {
        html += '<span style="color:#888780;font-size:11px">Aucun fichier dépendant</span>';
      } else {
        myDeps2.forEach(dep => {
          const cls = allCls[dep] || 'lv0';
          const nm  = allNodes[dep] ? allNodes[dep].name : '?';
          html += `<span class="dep-tag ${cls}" onclick="selectNode('${dep}')">${dep} ${nm}</span>`;
        });
      }
      html += '</div></div>';

      panel.innerHTML = html;
    }

    function selectNode(id) {
      activeId = id;
      render();
      updatePanel();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    window.selectNode = selectNode;

    /* ── Boot ── */
    (async () => {
      const data = await loadData();
      if (!data) return;
      buildLookups(data);
      buildLegend();
      render();
    })();
  </script>
</body>
</html>
